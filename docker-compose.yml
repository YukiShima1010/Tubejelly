version: '3.8'

services:
  tubejelly:
    build: .
    container_name: tubejelly-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # ホストの Jellyfin 音楽ディレクトリをコンテナの /music にマウント
      # 【重要】以下の /home/yukishima1010/jellyfin/media/music をあなたの実際のパスに変更してください
      - /home/yukishima1010/jellyfin/media/music:/music
    networks:
      - tubejelly-network
    # リソース制限（オプション）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  tubejelly-network:
    driver: bridge